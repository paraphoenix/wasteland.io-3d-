<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arcane Wizard - Low Poly Lightning</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070711;
    font-family: monospace;
}

#app {
    width: 100%;
    height: 100%;
}

#ui {
    position: absolute;

    left: 20px;
    z-index: 20;

    padding: 16px 20px;

    background: rgba(10, 8, 20, 0.9);

    border: 1px solid rgba(150, 100, 255, 0.4);

#ui h1 {
    color: #bd91ff;
    font-size: 18px;

}

#ui p {

}

#buttons {

    flex-direction: column;
    gap: 8px;

}

    border: 1px solid #8055ff;

button:hover {

<script type="importmap">

/*
=========================================================
LIGHTNING
=========================================================
*/

let lightning =
    null;


function castLightning() {

    if (lightning) {

        scene.remove(
            lightning
        );

        lightning =
            null;

    }


    const group =
        new THREE.Group();


    /*
    START AT STAFF GEM
    */

    const start =
        new THREE.Vector3();

    gem.getWorldPosition(
        start
    );


    /*
    WIZARD FORWARD
    */

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        wizard.quaternion
    );

    direction.normalize();


    const end =
        start.clone().add(
            direction.multiplyScalar(
                13
            )
        );


    /*
    ZIGZAG
    */

    const points = [];

    const segments = 22;


    for (
        let i = 0;
        i <= segments;
        i++
    ) {

        const t =
            i / segments;


        const point =
            new THREE.Vector3()
                .lerpVectors(
                    start,
                    end,
                    t
                );


        if (
            i !== 0 &&
            i !== segments
        ) {

            point.x +=
                (
                    Math.random() -
                    0.5
                ) * 0.7;


            point.y +=
                (
                    Math.random() -
                    0.5
                ) * 0.7;


            point.z +=
                (
                    Math.random() -
                    0.5
                ) * 0.7;

        }


        points.push(
            point
        );

    }


    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(
                points
            );


    /*
    WHITE CORE
    */

    const core =
        new THREE.Line(
            geometry,
            new THREE.LineBasicMaterial({

                color: 0xffffff

            })
        );

    group.add(
        core
    );


    /*
    PURPLE GLOW
    */

    const glow =
        new THREE.Line(
            geometry,
            new THREE.LineBasicMaterial({

                color: 0x754cff,

                transparent: true,

                opacity: 0.6

            })
        );

    glow.scale.set(
        1.8,
        1.8,
        1.8
    );

    group.add(
        glow
    );


    /*
    FLASH
    */

    const flash =
        new THREE.PointLight(
            0x8d6cff,
            12,
            10
        );

    flash.position.copy(
        start
    );

    group.add(
        flash
    );


    scene.add(
        group
    );


    lightning =
        group;


    magicLight.intensity =
        14;


    setTimeout(
        () => {

            if (
                lightning === group
            ) {

                scene.remove(
                    group
                );

                lightning =
                    null;

            }

        },
        180
    );

}


/*
=========================================================
CASTING
=========================================================
*/

let casting =
    false;

let castTimer =
    0;

const castDuration =
    0.9;


function startCast() {

    if (casting) {

        return;

    }


    casting =
        true;

    castTimer =
        0;


    document
        .getElementById(
            "status"
        )
        .textContent =
        "⚡ Charging arcane energy...";

}


/*
=========================================================
HAND ANIMATION
=========================================================
*/

function updateCasting(delta) {

    if (!casting) {

        return;

    }


    castTimer +=
        delta;


    const progress =
        Math.min(
            castTimer /
            castDuration,
            1
        );


    let rotation =
        0;


    /*
    =====================================================
    CHARGE
    =====================================================
    */

    if (
        progress < 0.45
    ) {

        const p =
            progress /
            0.45;


        const eased =
            p * p *
            (3 - 2 * p);


        rotation =
            THREE.MathUtils.lerp(
                0,
                -1.15,
                eased
            );

    }


    /*
    =====================================================
    RELEASE
    =====================================================
    */

    else if (
        progress < 0.65
    ) {

        const p =
            (
                progress -
                0.45
            ) /
            0.20;


        const eased =
            p * p *
            (3 - 2 * p);


        rotation =
            THREE.MathUtils.lerp(
                -1.15,
                0.75,
                eased
            );


        /*
        FIRE ONCE
        */

        if (
            castTimer >= 0.52 &&
            castTimer - delta < 0.52
        ) {

            castLightning();

            document
                .getElementById(
                    "status"
                )
                .textContent =
                "⚡ LIGHTNING CAST!";

        }

    }


    /*
    =====================================================
    RETURN
    =====================================================
    */

    else {

        const p =
            (
                progress -
                0.65
            ) /
            0.25;


        const eased =
            p * p *
            (3 - 2 * p);


        rotation =
            THREE.MathUtils.lerp(
                0.75,
                0,
                eased
            );

    }


    /*
    =====================================================
    ROTATE RIGHT HAND
    =====================================================
    */

    rightHand.rotation.x =
        rotation;


    rightHand.rotation.z =
        Math.sin(
            progress *
            Math.PI
        ) * 0.35;


    handMesh.rotation.y =
        Math.sin(
            progress *
            Math.PI
        ) * 0.7;


    /*
    =====================================================
    GEM CHARGE
    =====================================================
    */

    const charge =
        Math.sin(
            Math.min(
                progress *
                Math.PI,
                Math.PI
            )
        );


    const gemScale =
        1 +
        charge *
        0.4;


    gem.scale.set(
        gemScale,
        gemScale,
        gemScale
    );


    gem.rotation.y +=
        delta * 12;


    /*
    =====================================================
    MAGIC LIGHT
    =====================================================
    */

    magicLight.intensity =
        3 +
        charge * 10;


    /*
    =====================================================
    FINISH
    =====================================================
    */

    if (
        progress >= 1
    ) {

        casting =
            false;

        castTimer =
            0;


        rightHand.rotation.x =
            0;

        rightHand.rotation.z =
            0;


        handMesh.rotation.y =
            0;


        gem.scale.set(
            1,
            1,
            1
        );


        document
            .getElementById(
                "status"
            )
            .textContent =
            "Ready";

    }

}


/*
=========================================================
MOVEMENT
=========================================================
*/

const keys = {

    w: false,
    a: false,
    s: false,
    d: false

};


window.addEventListener(
    "keydown",
    (event) => {

        const key =
            event.key.toLowerCase();


        if (
            key === "w" ||
            key === "a" ||
            key === "s" ||
            key === "d"
        ) {

            keys[key] =
                true;

        }


        if (
            key === "e" ||
            event.code === "Space"
        ) {

            if (
                !event.repeat
            ) {

                startCast();

            }

        }

    }
);


window.addEventListener(
    "keyup",
    (event) => {

        const key =
            event.key.toLowerCase();


        if (
            key === "w" ||
            key === "a" ||
            key === "s" ||
            key === "d"
        ) {

            keys[key] =
                false;

        }

    }
);


/*
=========================================================
MOVEMENT UPDATE
=========================================================
*/

function updateMovement(delta) {

    const direction =
        new THREE.Vector3();


    if (keys.w) {

        direction.z -= 1;

    }


    if (keys.s) {

        direction.z += 1;

    }


    if (keys.a) {

        direction.x -= 1;

    }


    if (keys.d) {

        direction.x += 1;

    }


    if (
        direction.lengthSq() === 0
    ) {

        return;

    }


    direction.normalize();


    wizard.position.x +=
        direction.x *
        4 *
        delta;


    wizard.position.z +=
        direction.z *
        4 *
        delta;


    const targetRotation =
        Math.atan2(
            direction.x,
            direction.z
        );


    wizard.rotation.y =
        THREE.MathUtils.lerp(
            wizard.rotation.y,
            targetRotation,
            0.15
        );

}

=========================================================
CAST BUTTON

document

/*
=========================================================
GLB EXPORT
=========================================================
*/

document
    .getElementById(
        "exportButton"
    )
    .addEventListener(
        "click",
        () => {

            const status =
                document
                    .getElementById(
                        "status"
                    );


            status.textContent =
                "Preparing GLB export...";


            /*
            IMPORTANT:

            Lightning is temporary
            and should not be included.
            */

            const lightningWasVisible =
                lightning !== null;


            if (lightningWasVisible) {

                lightning.visible =
                    false;

            }


            /*
            Update world matrices
            */

            scene.updateMatrixWorld(
                true
            );


            /*
            Create exporter
            */

            const exporter =
                new GLTFExporter();


            /*
            Clone wizard
            */

            const exportWizard =
                wizard.clone(
                    true
                );


            exportWizard.name =
                "ArcaneWizard";


            /*
            New export scene
            */

            const exportScene =
                new THREE.Scene();


            exportScene.name =
                "ArcaneWizardGLB";


            exportScene.add(
                exportWizard
            );


            /*
            Export
            */

            exporter.parse(

                exportScene,

                (result) => {

                    let blob;


                    if (
                        result instanceof ArrayBuffer
                    ) {

                        blob =
                            new Blob(
                                [result],
                                {
                                    type:
                                        "model/gltf-binary"
                                }
                            );

                    } else {

                        blob =
                            new Blob(
                                [
                                    JSON.stringify(
                                        result
                                    )
                                ],
                                {
                                    type:
                                        "model/gltf+json"
                                }
                            );

                    }


                    const url =
                        URL.createObjectURL(
                            blob
                        );


                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        url;


                    link.download =
                        "arcane-wizard.glb";


                    document
                        .body
                        .appendChild(
                            link
                        );


                    link.click();


                    link.remove();


                    setTimeout(
                        () => {

                            URL.revokeObjectURL(
                                url
                            );

                        },
                        1000
                    );


                    if (
                        lightningWasVisible
                    ) {

                        lightning.visible =
                            true;

                    }


                    status.textContent =
                        "✓ Exported arcane-wizard.glb";

                },


                (error) => {

                    console.error(
                        "GLB export failed:",
                        error
                    );


                    if (
                        lightningWasVisible
                    ) {

                        lightning.visible =
                            true;

                    }


                    status.textContent =
                        "✕ GLB export failed";

                },


                {
                    binary: true,

                    trs: false,

                    onlyVisible: true,

                    truncateDrawRange:
                        true,

                    maxTextureSize:
                        4096

                }

            );

        }
    );


/*
=========================================================
RESET CAMERA
=========================================================
*/

document
    .getElementById(
        "resetButton"
    )
    .addEventListener(
        "click",
        () => {

            camera.position.set(
                7,
                4.5,
                9
            );


            controls.target.set(
                0,
                2,
                0
            );


            controls.update();


            document
                .getElementById(
                    "status"
                )
                .textContent =
                "Camera reset";

        }
    );


/*
=========================================================
ANIMATION
=========================================================
*/

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    const time =
        clock.elapsedTime;


    /*
    MOVEMENT
    */

    updateMovement(
        delta
    );


    /*
    CASTING
    */

    updateCasting(
        delta
    );


    /*
    IDLE FLOAT
    */

    if (!casting) {

        wizard.position.y =
            Math.sin(
                time * 1.5
            ) * 0.04;

    }


    /*
    RUNE
    */

    rune.rotation.z +=
        delta * 0.2;


    /*
    GEM IDLE
    */

    if (!casting) {

        gem.rotation.y +=
            delta * 1.5;

    }


    /*
    MAGIC LIGHT
    */

    if (!casting) {

        magicLight.intensity =
            3 +
            Math.sin(
                time * 3
            ) * 0.7;

    }


    /*
    CONTROLS
    */

    controls.update();


    /*
    RENDER
    */

    renderer.render(
        scene,
        camera
    );

}


animate();


/*
=========================================================
RESIZE
=========================================================
*/

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>
